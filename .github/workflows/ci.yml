name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: # reused by release.yml as a gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SWIFTLINT_VERSION: "0.65.1"

jobs:
  # Single place to toggle optional jobs. Set linux to "false" for libraries
  # that import Apple-only frameworks (CoreLocation, SwiftUI, ...).
  config:
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.flags.outputs.linux }}
    steps:
      - id: flags
        run: echo "linux=true" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    container: swift:latest
    steps:
      - uses: actions/checkout@v4
      - name: swift-format
        run: swift format lint --strict --recursive Sources Tests Package.swift
      - name: SwiftLint
        run: |
          apt-get update -qq && apt-get install -y -qq curl unzip >/dev/null
          arch=$(uname -m | sed 's/x86_64/amd64/')
          curl -fsSL -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_${arch}.zip"
          unzip -q swiftlint.zip -d "$RUNNER_TEMP/swiftlint"
          "$RUNNER_TEMP/swiftlint/swiftlint" --strict

  test-linux:
    needs: config
    if: needs.config.outputs.linux == 'true'
    runs-on: ubuntu-latest
    container: swift:latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test -Xswiftc -warnings-as-errors

  # `xcode-27` is the GitHub image with Xcode 27 (preview). Xcode is selected
  # from .xcode-version; bump that file when a newer Xcode is on the image.
  macos:
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        job: [test, demo]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      - name: Test
        if: matrix.job == 'test'
        run: make test
      - name: Demo app (iOS Simulator)
        if: matrix.job == 'demo'
        run: |
          xcodebuild build -project Examples/DemoApp.xcodeproj -scheme DemoApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO -quiet
      - name: Demo app (macOS)
        if: matrix.job == 'demo'
        run: |
          xcodebuild build -project Examples/DemoApp.xcodeproj -scheme DemoApp \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO -quiet

  # Skipped on PRs. Runs on pushes to main and when release.yml calls this
  # workflow, so a broken DocC build stops a release.
  docs:
    if: github.event_name != 'pull_request'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      - run: make docs
